{% extends 'base.html' %}

{% block title %}Registrar Mantenimiento{% endblock %}

{% block content %}
<h2>🔧 Registro de Mantenimiento</h2>

<div class="card">
    <h3>📄 {{ asset.name }}</h3>
    <p><strong>Código:</strong> {{ asset.barcode }}</p>
    <p><strong>Estado:</strong> <span class="badge badge-{{ asset.status.lower() }}">{{ asset.status }}</span></p>
</div>

<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="type">Tipo de Mantenimiento *</label>
                <select id="type" name="type" required>
                    <option value="PREVENTIVE">Preventivo</option>
                    <option value="CORRECTIVE">Correctivo</option>
                    <option value="INSPECTION">Inspección</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Fecha *</label>
                <input type="date" id="date" name="date" value="{{ datetime.now().strftime('%Y-%m-%d') }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label for="title">Título *</label>
                <input type="text" id="title" name="title" required placeholder="Ej: Cambio de disco duro, limpieza general, etc.">
            </div>
            <div class="form-group">
                <label for="cost">Costo (Bs.)</label>
                <input type="number" id="cost" name="cost" step="0.01" placeholder="0.00">
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">Descripción *</label>
            <textarea id="description" name="description" rows="3" required placeholder="Describa el trabajo realizado..."></textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group" style="flex: 2;">
                <label for="performed_by">Realizado por *</label>
                <input type="text" id="performed_by" name="performed_by" value="{{ current_user.full_name }}" required>
            </div>
            <div class="form-group">
                <label for="next_maintenance">Próximo mantenimiento</label>
                <input type="date" id="next_maintenance" name="next_maintenance">
            </div>
        </div>
        
        <div class="form-group">
            <label for="status">Estado *</label>
            <select id="status" name="status" required>
                <option value="COMPLETED">Completado</option>
                <option value="PENDING">Pendiente</option>
                <option value="IN_PROGRESS">En progreso</option>
            </select>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-success">💾 Guardar Registro</button>
            <a href="{{ url_for('asset_detail', asset_id=asset.id) }}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
