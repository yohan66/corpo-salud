{% extends 'base.html' %}

{% block title %}Iniciar Sesión - CORPOSALUD{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 5rem auto;">
    <h2 style="text-align: center;">🔐 Iniciar Sesión</h2>
    <p style="text-align: center; color: #666; margin-bottom: 2rem;">Sistema de Inventario - CORPOSALUD Táchira</p>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <div class="form-group">
            <label style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" name="remember" style="width: auto;">
                <span>Recordar sesión</span>
            </label>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
    </form>
    
    <div style="text-align: center; margin-top: 2rem; font-size: 0.85rem; color: #666; border-top: 1px solid #e0e0e0; padding-top: 1rem;">
        <p>Credenciales de prueba:</p>
        <p><strong>Usuario:</strong> admin</p>
        <p><strong>Contraseña:</strong> Admin2024!</p>
    </div>
</div>
{% endblock %}
